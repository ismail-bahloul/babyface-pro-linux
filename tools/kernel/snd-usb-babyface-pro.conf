# Latency profile for snd-usb-babyface-pro.
#
# The driver ships conservative defaults (frames_per_urb=256, nurbs=8 —
# about 5.3 ms of URB quantisation at 48 kHz) so that a fresh install is
# stable everywhere. The low-latency profiles below are what make this
# driver interesting, but they are OFF until you opt in: uncomment one
# line, then reload the module (or reboot).
#
# Measured on real hardware at 48 kHz, full-duplex playback + capture
# through PipeWire (see KERNEL-DRIVER.md for the full sweep):
#
#   frames_per_urb  nurbs   period    result
#   --------------  -----   -------   ---------------------------------
#   256 (default)   8       5.3 ms    100 % stable
#   64              8       1.3 ms    100 % stable
#   32              8       0.67 ms   100 % stable  <- recommended
#   16              8       0.33 ms   light cutouts
#   16              16      0.33 ms   playback rock-solid, but capture
#                                     drops ~1 sample per 7 s in a soak
#   8               16      0.17 ms   ~90 %, audible crackle
#
# Note the asymmetry at 0.33 ms: playback is solid but *recording* is
# not. Pick 32/8 unless you are monitoring only and can accept the
# occasional capture drop.
#
# Latency is quantised to the URB boundary, so it does NOT depend on the
# period/buffer size your DAW or PipeWire asks for — only on these.

# Recommended: 0.67 ms, measured glitch-free for both directions.
#options snd-usb-babyface-pro frames_per_urb=32 nurbs=8

# Absolute floor: 0.33 ms. Monitoring-grade — expect rare capture drops.
#options snd-usb-babyface-pro frames_per_urb=16 nurbs=16
