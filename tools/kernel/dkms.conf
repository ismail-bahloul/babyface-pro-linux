#
# DKMS config for the RME Babyface Pro FS proprietary-mode driver.
# Lets the module survive kernel upgrades without a manual rebuild —
# see the Makefile in this directory for the plain `make`/`insmod`
# path this wraps.

PACKAGE_NAME="snd-usb-babyface-pro"
PACKAGE_VERSION="0.1.0"

BUILT_MODULE_NAME[0]="snd-usb-babyface-pro"
DEST_MODULE_LOCATION[0]="/kernel/sound/usb"

# CachyOS (and other clang-built-kernel distros) need LLVM=1; a stock
# gcc-built kernel doesn't and rejects it. Try plain gcc first, fall
# back to LLVM only if that fails, so one dkms.conf covers both.
MAKE[0]="make -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build modules || make LLVM=1 CC=clang -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build modules"

AUTOINSTALL="yes"
